<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendar — the turning week</title>
<meta name="description" content="A week you turn. Seven days on an arc, events as blocks on the day's own time axis.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230C0A18'/%3E%3Crect x='7' y='6' width='5' height='20' rx='2' fill='%2300E5D0'/%3E%3Crect x='14' y='10' width='5' height='16' rx='2' fill='%23FF4D8D'/%3E%3Crect x='21' y='14' width='5' height='12' rx='2' fill='%237C5CFF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Non-blocking: a plain stylesheet link blocks SCRIPT EXECUTION until it
     resolves, and a slow font host once stopped a build here from running. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap"></noscript>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <header class="top">
    <div>
      <p class="kick">Week of</p>
      <h1 id="weekLabel">—</h1>
    </div>
    <div class="tools">
      <button class="ghost" id="prev" aria-label="Previous week">&lsaquo;</button>
      <button class="ghost" id="todayBtn">This week</button>
      <button class="ghost" id="next" aria-label="Next week">&rsaquo;</button>
    </div>
  </header>

  <!-- the rig. Columns are real DOM inside a preserve-3d scene, so events
       stay clickable, focusable and readable by a screen reader. -->
  <section class="stage" id="stage" aria-label="The week">
    <div class="scene" id="scene"></div>
    <p class="hint" id="hint">drag to turn the week</p>
  </section>

  <section class="rail">
    <div class="day-head">
      <h2 id="dayLabel">—</h2>
      <span class="tag" id="dayTag"></span>
      <span class="free" id="dayFree"></span>
    </div>
    <ul class="list" id="list"></ul>

    <button class="add" id="addBtn">+ Add to this day</button>

    <form class="form" id="form" hidden>
      <p class="f-title" id="formTitle">New event</p>
      <label class="f-row"><span>What</span>
        <input id="fTitle" type="text" maxlength="60" placeholder="Shift, lecture, gym…" autocomplete="off"></label>
      <div class="f-two">
        <label class="f-row"><span>From</span><input id="fStart" type="time" step="300"></label>
        <label class="f-row"><span>To</span><input id="fEnd" type="time" step="300"></label>
      </div>
      <label class="f-row"><span>Type</span>
        <select id="fKind">
          <option value="class">Class</option>
          <option value="work">Work</option>
          <option value="personal">Personal</option>
        </select></label>
      <p class="f-err" id="fErr" role="alert"></p>
      <div class="f-acts">
        <button type="submit" class="solid">Save</button>
        <button type="button" class="ghost" id="fCancel">Cancel</button>
      </div>
    </form>
  </section>

  <footer class="foot">
    <p>Saved in this browser only &middot; drag the week, or use &larr; &rarr;</p>
    <button class="ghost quiet" id="clearBtn">Clear all</button>
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
