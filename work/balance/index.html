<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Balance — weigh the sealed box</title>
<meta name="description" content="A beam balance. Drag brass weights onto the pan until it levels. Nothing tells you the answer but the tilt.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316203A'/%3E%3Crect x='4' y='13' width='24' height='2.5' rx='1' fill='%23C6CDD6' transform='rotate(-9 16 14)'/%3E%3Crect x='15' y='14' width='2' height='12' fill='%23C6CDD6'/%3E%3Ccircle cx='7' cy='19' r='3' fill='%23CE9B4E'/%3E%3Ccircle cx='25' cy='11' r='3' fill='%23CE9B4E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Non-blocking: a plain stylesheet link blocks SCRIPT EXECUTION until it
     resolves, and a slow font host once stopped a build in this folder from
     starting at all. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=DM+Mono:wght@400;500&display=swap"></noscript>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="room">

  <header class="head">
    <p class="eyebrow">BALANCE</p>
    <h1>Weigh the sealed box.</h1>
  </header>

  <div class="stage" id="stage">
    <canvas id="scale" aria-label="A beam balance. Drag brass weights from the tray onto the right-hand pan until the beam levels."></canvas>
  </div>

  <p class="hint" id="hint">Drag a weight onto the right pan.</p>

  <div class="rack">
    <div class="readout"><span class="r-k">ON PAN</span><span class="r-v" id="rPan">0<i>g</i></span></div>
    <div class="readout"><span class="r-k">SOLVED</span><span class="r-v" id="rSolved">0</span></div>
    <div class="spacer"></div>
    <button type="button" class="btn" id="bClear">CLEAR PAN</button>
    <button type="button" class="btn" id="bNew">NEW BOX</button>
  </div>

  <footer class="foot">
    <p>No scale, no number, no hint. The beam is the only instrument &mdash; when it sits level, what you stacked is what the box weighs.</p>
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
