<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bagatelle — pull, let go, watch it fall</title>
<meta name="description" content="A bagatelle board. Pull the plunger, let it go, and watch the ball find a cup. Nine balls a game.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232A1018'/%3E%3Ccircle cx='10' cy='9' r='2' fill='%23C9A227'/%3E%3Ccircle cx='20' cy='9' r='2' fill='%23C9A227'/%3E%3Ccircle cx='15' cy='16' r='2' fill='%23C9A227'/%3E%3Crect x='6' y='23' width='20' height='6' fill='%232F5D46'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Non-blocking: a plain stylesheet link blocks SCRIPT EXECUTION until it
     resolves, and a slow font host will stop this page's own JS from ever
     running. Measured at 4.7s on another build in this folder. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700&family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700&family=DM+Mono:wght@400;500&display=swap"></noscript>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="parlour">

  <header class="head">
    <p class="eyebrow">BAGATELLE</p>
    <h1>Nine balls.<br>Pull, let go.</h1>
  </header>

  <div class="table">
    <div class="stage" id="stage">
      <canvas id="board" aria-label="A bagatelle board. Drag down on the plunger at the right, then let go to launch a ball."></canvas>
    </div>

    <p class="hint" id="hint">Drag down on the plunger, then let go.</p>

    <div class="rack">
      <div class="readout"><span class="r-k">SCORE</span><span class="r-v" id="rScore">0</span></div>
      <div class="readout"><span class="r-k">BALLS</span><span class="r-v" id="rBalls">9</span></div>
      <div class="readout"><span class="r-k">BEST</span><span class="r-v" id="rBest">0</span></div>
      <div class="spacer"></div>
      <button type="button" class="btn" id="bLaunch">LAUNCH</button>
      <button type="button" class="btn" id="bNew">NEW GAME</button>
    </div>
  </div>

  <footer class="foot">
    <p>The cups keep their own tally &mdash; the board is the scoreboard.</p>
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
