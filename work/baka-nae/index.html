<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>baka nae. — sprue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- ⚠️ Fonts are loaded NON-BLOCKING on purpose.
     A plain <link rel="stylesheet"> blocks SCRIPT EXECUTION until it
     resolves, so a slow third-party stylesheet stops the page's own
     JavaScript from ever running. Measured here: fonts.googleapis.com took
     4.7s, and the app never started — document.readyState sat at "loading"
     and the canvas stayed blank. media="print" + onload flips it to a
     non-blocking fetch that upgrades itself once it lands. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap"></noscript>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="film" aria-hidden="true"></div>

<div class="sheet">

  <header class="top">
    <div class="mark">
      <p class="handle" data-i18n="handle">SHOPEE · @baka_nae</p>
      <h1 class="word">baka nae.</h1>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" class="lang-b" data-lang="id">ID</button>
      <button type="button" class="lang-b" data-lang="en">EN</button>
    </div>
  </header>

  <section class="side">
    <p class="tag" data-i18n="tag"></p>

    <nav class="tabs" id="tabs" aria-label="Runner"></nav>

    <p class="hint" data-i18n="hint"></p>
  </section>

  <div class="bay">
    <div class="bay3d" id="bay3d">
      <svg id="sprue" class="sprue" viewBox="-56 -46 632 764" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="sprue-t">
        <title id="sprue-t">baka nae parts runner</title>

        <defs id="clips"></defs>

        <!-- six spent runners: one per year of the shop -->
        <g id="spent"></g>

        <!-- the live runner -->
        <g id="frame">
          <g class="rails">
            <rect class="rail" x="22" y="22" width="516" height="92"/>
            <rect class="rail" x="22" y="628" width="516" height="52"/>
            <rect class="rail" x="22" y="22" width="18" height="658"/>
            <rect class="rail" x="520" y="22" width="18" height="658"/>
            <rect class="strut" x="275" y="114" width="10" height="514"/>
            <rect class="strut" x="40" y="284" width="480" height="10"/>
            <rect class="strut" x="40" y="458" width="480" height="10"/>
          </g>

          <g class="mould">
            <text class="mould-t big" x="52" y="82">BAKA NAE®</text>
            <text class="mould-t" x="52" y="662">©2020–2026 MADE IN ID</text>
            <text class="mould-t ta-e" id="counter" x="508" y="662">A 0/6</text>
          </g>

          <g id="qc" class="qc" role="button" tabindex="0" aria-label="QC">
            <rect class="hit" x="392" y="24" width="94" height="88" fill="transparent"/>
            <circle class="qc-ring" cx="439" cy="68" r="41"/>
            <circle class="qc-ring in" cx="439" cy="68" r="33"/>
            <text class="qc-n" x="439" y="72">4,97</text>
            <text class="qc-s" x="439" y="94">QC</text>
          </g>

          <g id="parts"></g>
        </g>
      </svg>

      <div class="ink" id="ink"><span data-i18n="ink"></span></div>
    </div>
  </div>

  <aside class="tray-col">
    <div class="well" id="well">
      <div class="well-lip" aria-hidden="true"></div>
      <p class="well-hint" data-i18n="wellhint"></p>
      <div class="tray" id="tray" hidden></div>
    </div>
  </aside>

  <footer class="rail-foot">
    <a class="buy" id="buy" href="https://shopee.co.id/baka_nae" target="_blank" rel="noopener">
      <span data-i18n="buy"></span>
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
    </a>
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
