<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUMEN — hot glass, one at a time</title>
<meta name="description" content="LUMEN is a glassblowing studio in Brunswick. Six one-off vessels, turned in real light.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="stage" aria-label="A glass vessel on a lit turntable. Drag to turn it."></canvas>

<div class="grain" aria-hidden="true"></div>

<div id="lamp" class="lamp" role="slider" tabindex="0"
     aria-label="Light handle — drag to move the light"
     aria-valuemin="0" aria-valuemax="100" aria-valuenow="26" aria-valuetext="light from the left, raised">
  <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="halo" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#FFE9C4" stop-opacity=".85"/>
        <stop offset="38%"  stop-color="#FFC978" stop-opacity=".22"/>
        <stop offset="100%" stop-color="#FFB255" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="32" cy="32" r="30" fill="url(#halo)"/>
    <circle cx="32" cy="32" r="5.2" fill="#FFF3DE"/>
    <circle cx="32" cy="32" r="10.5" fill="none" stroke="#FFD9A0" stroke-opacity=".55" stroke-width="1"/>
  </svg>
  <span class="lamp-tag">LAMP</span>
</div>

<div class="ui">

  <header class="frame-top">
    <div class="mark">
      <span class="mark-name">LUMEN</span>
      <span class="mark-sub">Hot glass, one at a time · Brunswick</span>
    </div>
    <nav class="views" aria-label="Sections">
      <a href="#vessels" data-view="vessels" class="on">Vessels</a>
      <a href="#care" data-view="care">Care &amp; firing</a>
      <a href="#studio" data-view="studio">Studio</a>
    </nav>
  </header>

  <div class="middle">
    <div class="rail" id="rail" aria-label="Six pieces, drawn to scale"></div>
    <div class="gap"></div>
    <section class="read" id="read" aria-live="polite"></section>
  </div>

  <footer class="frame-bottom">
    <p class="hint">Drag the vessel to turn it. Drag the lamp to move the light.</p>
    <p class="tally" id="tally">HANDLED <span id="tally-n">0</span>/6 — a piece counts once you have turned it right round</p>
    <div class="act">
      <span class="price" id="price">A$1,480</span>
      <button type="button" id="enquire">Enquire</button>
    </div>
  </footer>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script src="app.js"></script>
</body>
</html>
