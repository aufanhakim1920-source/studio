<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LINE 4 MERIDIAN — Central Control</title>
<meta name="description" content="Live control board for one metro line: train positions, delay propagation, platform crowding and open faults.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f0f4fa'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='20' font-weight='600' text-anchor='middle' fill='%2308090c'%3E4%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="frame">
  <header class="masthead">
    <div class="ident">
      <span class="mark">4</span>
      <span class="idn">MERIDIAN</span>
      <span class="idsub">CENTRAL CONTROL &middot; DOWN LINE &middot; KLB&ndash;EMR</span>
    </div>
    <div class="transport">
      <span class="clock" id="clock">--:--:--</span>
      <span class="clockNote" id="clockNote">&nbsp;</span>
      <button type="button" class="step" id="b-5" aria-label="back five minutes">&minus;5m</button>
      <button type="button" class="step" id="b-1" aria-label="back one minute">&minus;1m</button>
      <button type="button" class="step" id="b+1" aria-label="forward one minute">+1m</button>
      <button type="button" class="step" id="b+5" aria-label="forward five minutes">+5m</button>
      <input type="range" id="scrub" aria-label="time scrub" min="2400" max="5400" step="5" value="4020">
    </div>
  </header>
  <nav class="jump" aria-label="board sections">
    <a href="#sec-line">LINE</a>
    <a href="#sec-stations">STATIONS</a>
    <a href="#sec-detail">DETAIL</a>
  </nav>
  <section class="worst" id="worst" aria-live="polite"></section>
  <section class="diagram" id="sec-line">
    <div class="lede">
      <span class="cap">LINE</span>
      <span class="legend" id="legend"></span>
    </div>
    <div class="track" id="track">
      <div class="rule" aria-hidden="true"></div>
      <div class="stops" id="stops"></div>
      <div class="units" id="units"></div>
    </div>
  </section>
  <section class="headway">
    <div class="lede">
      <span class="cap">HEADWAY</span>
      <span class="legend" id="hwNote"></span>
    </div>
    <div class="bars" id="hwBars"></div>
  </section>
  <div class="lower">
    <section class="ledger" id="sec-stations">
      <div class="lede">
        <span class="cap">STATIONS</span>
        <span class="filters">
          <button type="button" class="chip is-on" data-f="all">ALL</button>
          <button type="button" class="chip" data-f="late">LATE CALL</button>
          <button type="button" class="chip" data-f="crowd">CROWDED</button>
        </span>
      </div>
      <div class="thead">
        <span>STATION</span><span>DWELL</span><span>GAP</span><span>WAIT</span><span>PLATFORM</span>
      </div>
      <div class="rows" id="stnRows"></div>
    </section>
    <section class="roster">
      <div class="lede"><span class="cap">UNITS</span><span class="legend" id="unitNote"></span></div>
      <div class="thead thead-u">
        <span>UNIT</span><span>AT</span><span>DELAY</span><span>LOAD</span>
      </div>
      <div class="rows" id="unitRows"></div>
      <div class="lede lede-2"><span class="cap">FAULTS</span><span class="legend" id="faultNote"></span></div>
      <div class="rows rows-f" id="faultRows"></div>
    </section>
    <section class="aside" id="sec-detail">
      <div class="lede"><span class="cap" id="detCap">DETAIL</span></div>
      <div class="detail" id="detail"></div>
    </section>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
