<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aufan Rachmad — Specimen Drawer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232A211B'/%3E%3Crect x='4' y='8' width='24' height='16' rx='1' fill='%23E8E0D0'/%3E%3Ccircle cx='16' cy='14' r='2.6' fill='%23B8955A'/%3E%3C/svg%3E">
</head>
<body>

<a class="skip" href="#tray">Skip to the work</a>

<div class="cab">

  <header class="plate">
    <div class="plate__l">
      <p class="cap">Cabinet 01 <span class="sep">/</span> Drawer 3 of 3</p>
      <h1>Aufan Rachmad</h1>
      <p class="sub">Data Science, University of Melbourne. Nine specimens, collected 2026.</p>
    </div>
    <dl class="plate__r" id="key"></dl>
  </header>

  <!-- ── the drawer. Pull it, and the specimens are inside. ─────────────── -->
  <section class="drawer" id="drawer">
    <button class="pull" id="pull" aria-expanded="false" aria-controls="tray">
      <span class="pull__grip" aria-hidden="true"></span>
      <span class="pull__t" id="pullT">Pull the drawer</span>
    </button>

    <div class="tray" id="tray" aria-label="Nine projects, pinned">
      <div class="tray__liner" id="liner"></div>
    </div>
  </section>

  <!-- ── the specimen record, when one is lifted ─────────────────────────── -->
  <aside class="rec" id="rec" hidden aria-live="polite">
    <button class="rec__x" id="recX" aria-label="Pin it back">&times;</button>
    <p class="cap" id="recNo">—</p>
    <h2 id="recName">—</h2>
    <p class="rec__meta"><span id="recYear">—</span> <span class="sep">/</span> <span id="recStatus">—</span></p>
    <p class="rec__d" id="recDesc">—</p>
    <ul class="rec__tags" id="recTags"></ul>
    <a class="rec__a" id="recLink" href="#" hidden>Open it &rsaquo;</a>
    <p class="rec__note" id="recNote"></p>
  </aside>

  <footer class="foot">
    <p class="cap dim">Specimens pinned square are finished. Crooked ones are still being worked on.</p>
    <p class="cap dim">aufanhakim1920@gmail.com <span class="sep">/</span> Melbourne</p>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
