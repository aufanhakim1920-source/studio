<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RETAIL OPS // WALL 01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050300'/%3E%3Crect x='4' y='20' width='4' height='7' fill='%238a6300'/%3E%3Crect x='11' y='13' width='4' height='14' fill='%23ffb300'/%3E%3Crect x='18' y='7' width='4' height='20' fill='%23ffb300'/%3E%3Crect x='25' y='16' width='3' height='11' fill='%238a6300'/%3E%3C/svg%3E">
</head>
<body>

<a class="skip" href="#tube">Skip to board</a>

<div class="tube" id="tube">

  <header class="hd">
    <span class="hd__id">RETAIL OPS <b>// WALL 01</b></span>
    <span class="hd__mid" id="stat">BOOT</span>
    <span class="hd__r">SRC UCI &middot; <span id="asof">—</span></span>
  </header>

  <!-- ── the readout: one month, four numbers, readable across a room ────── -->
  <section class="read" aria-live="polite">
    <div class="read__l">
      <p class="k">MONTH</p>
      <p class="read__m" id="rMonth">—</p>
      <p class="k" id="rNote">&nbsp;</p>
    </div>
    <div class="read__v">
      <p class="k">REVENUE</p>
      <p class="big" id="rRev">—</p>
      <p class="d" id="rRevD">&nbsp;</p>
    </div>
    <div class="read__s">
      <div><p class="k">ORDERS</p><p class="mid" id="rOrd">—</p><p class="d" id="rOrdD">&nbsp;</p></div>
      <div><p class="k">BASKET</p><p class="mid" id="rAov">—</p><p class="d" id="rAovD">&nbsp;</p></div>
      <div><p class="k">BUYERS</p><p class="mid" id="rCus">—</p><p class="d" id="rCusD">&nbsp;</p></div>
    </div>
  </section>

  <!-- ── the scrubber: 13 months. This is the only control. ──────────────── -->
  <section class="scrub" aria-label="Select month">
    <p class="k">TIMELINE &mdash; CLICK OR ARROW</p>
    <div class="scrub__t" id="scrub" role="radiogroup" aria-label="Month"></div>
  </section>

  <!-- ── markets for the selected month ──────────────────────────────────── -->
  <section class="mkt">
    <div class="mkt__h"><p class="k">MARKETS &mdash; SELECTED MONTH</p><p class="k" id="mktN">—</p></div>
    <div class="bars" id="bars"></div>
  </section>

  <footer class="ft">
    <span id="ftL">—</span>
    <span id="ftR">—</span>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
