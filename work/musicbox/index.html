<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kotak Nada — a music box you can re-pin</title>
<meta name="description" content="A hand-cranked music box. Drag to turn the cylinder, tap a tooth to leave a pin. The pins are the score.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230C2A2E'/%3E%3Crect x='4' y='12' width='24' height='8' rx='4' fill='%23C9A227'/%3E%3Crect x='9' y='7' width='2' height='5' fill='%23F0D274'/%3E%3Crect x='16' y='7' width='2' height='5' fill='%23F0D274'/%3E%3Crect x='22' y='7' width='2' height='5' fill='%23F0D274'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- ⚠️ Fonts are loaded NON-BLOCKING on purpose.
     A plain <link rel="stylesheet"> blocks SCRIPT EXECUTION until it
     resolves, so a slow third-party stylesheet stops the page's own
     JavaScript from ever running. Measured here: fonts.googleapis.com took
     4.7s, and the app never started — document.readyState sat at "loading"
     and the canvas stayed blank. media="print" + onload flips it to a
     non-blocking fetch that upgrades itself once it lands. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Mono:wght@400;500&display=swap"></noscript>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="room">

  <header class="head">
    <p class="eyebrow">KOTAK NADA</p>
    <h1>A music box you can re&#8209;pin.</h1>
  </header>

  <!-- the instrument. The canvas draws the case, cylinder, pins and comb in
       hand-rolled 3D; the buttons over the comb are real DOM so the teeth are
       keyboard-reachable and big enough for a thumb. -->
  <div class="bench">
    <div class="stage" id="stage">
      <canvas id="box" aria-label="A hand-cranked music box. Drag left or right to turn the cylinder."></canvas>
      <div class="teeth" id="teeth" role="group" aria-label="Comb teeth — press one to leave a pin at the cylinder's current position"></div>
    </div>

    <p class="hint" id="hint">Drag the cylinder to crank it.</p>

    <div class="rack">
      <div class="readout">
        <span class="r-k">PINS</span><span class="r-v" id="rPins">0</span>
      </div>
      <div class="readout">
        <span class="r-k">TURNS</span><span class="r-v" id="rTurns">0</span>
      </div>
      <div class="spacer"></div>
      <button type="button" class="btn" id="bSound" aria-pressed="false">SOUND&nbsp;<b>OFF</b></button>
      <button type="button" class="btn" id="bReset">RESET</button>
      <button type="button" class="btn" id="bClear">CLEAR</button>
    </div>
  </div>

  <footer class="foot">
    <p>Thirteen teeth, pentatonic. Every note is synthesised in the browser &mdash; no audio files.</p>
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
