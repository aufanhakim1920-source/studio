<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Annual Skyline — Retail Operations</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0E1A'/%3E%3Crect x='5' y='20' width='4' height='7' fill='%23FFB238'/%3E%3Crect x='11' y='13' width='4' height='14' fill='%238891A8'/%3E%3Crect x='17' y='6' width='4' height='21' fill='%23FFB238'/%3E%3Crect x='23' y='16' width='4' height='11' fill='%238891A8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <span class="kicker">RETAIL OPERATIONS <span class="dim">·</span> UK GIFT WHOLESALER</span>
  <span class="range">1 DEC 2010 &ndash; 9 DEC 2011</span>
</header>

<main>
  <section class="hero">
    <div class="intro">
      <h1>The annual<br>skyline</h1>
      
      <div class="yearstats" id="yearStats"></div>
    </div>

    <div class="instrument">

      <div class="skyline-wrap">
        <div class="skyline" id="skyline">
          <div class="city" id="city" role="group" aria-label="Monthly revenue skyline, 13 buildings"></div>
        </div>
        <div class="floor-line" aria-hidden="true"></div>
        <div class="plaque" id="plaque"></div>
      </div>

      <div class="console">

        <div class="dial-unit">
          
          <div class="dial-stage">
            <div class="tick-ring" id="tickRing" aria-hidden="true"></div>
            <div class="dial"
                 id="dial"
                 tabindex="0"
                 role="slider"
                 aria-label="Month scrubber"
                 aria-valuemin="1"
                 aria-valuemax="13"
                 aria-valuenow="12">
              <div class="dial-rotator" id="dialRotator">
                <span class="dial-notch"></span>
              </div>
              <div class="dial-static-lighting" aria-hidden="true"></div>
            </div>
          </div>
          <span class="dial-label">DRAG TO SCRUB</span>
        </div>

        <div class="readout" id="readout">
          <div class="readout-top">
            <span class="led" id="led" aria-hidden="true"></span>
            <span class="readout-month" id="rMonth">&mdash;</span>
            <span class="badge" id="rBadge" hidden></span>
          </div>

          <div class="readout-value">
            <span class="value" id="rValue">&mdash;</span>
            <span class="delta" id="rDelta"></span>
          </div>

          <div class="readout-row">
            <div class="stat">
              <span class="stat-label">ORDERS</span>
              <span class="stat-value" id="rOrders">&mdash;</span>
            </div>
            <div class="stat">
              <span class="stat-label" title="Average order value">AOV</span>
              <span class="stat-value" id="rAov">&mdash;</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>

  <section class="findings">
    <span class="kicker">FINDINGS</span>
    <div class="finding-grid" id="findingGrid"></div>
  </section>
</main>

<footer id="prov"></footer>

<script src="app.js"></script>
</body>
</html>
