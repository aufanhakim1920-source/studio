<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aufan — Core Sample</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<main class="page">

  <header class="mast">
    <h1>Aufan</h1>
    <p class="lede">One core, drilled through a first year.</p>
    <p class="tag"><span>Melbourne, from Surabaya</span><span>BSc Data Science, Unimelb</span></p>
  </header>

  <div class="band">

    <section class="core-stage" id="stage" tabindex="0" role="application"
             aria-label="A core sample. Drag it, or use the up and down arrow keys to bring a layer into the reading window. Press Enter to cut the layer open.">
      <div class="barrel" id="barrel">
        <div class="drift" id="drift">
          <div class="cap" aria-hidden="true"></div>

          <div class="ruler" id="ruler" aria-hidden="true">
            <span style="--at:0">0</span>
            <span style="--at:20">20</span>
            <span style="--at:40">40</span>
            <span style="--at:60">60</span>
            <span style="--at:80">80</span>
            <span style="--at:100">100</span>
            <span style="--at:120">120</span>
            <span style="--at:140">140</span>
          </div>

          <div class="strata" id="strata">
            <div class="layer k-web"    style="--cm:10" data-n="baka nae." data-t="In build"
                 data-c="A bilingual brand site for a label with 10.7k followers."
                 data-a="EN + JP" data-b="Hand-rolled"></div>

            <div class="layer k-mark"   style="--cm:6"  data-n="Bakery, 6am" data-t="Marker bed"
                 data-c="Front of house from six in the morning. Hired off a cold email."
                 data-a="Natural Tucker" data-b="Still there"></div>

            <div class="layer k-web"    style="--cm:13" data-n="Week Board" data-t="Live"
                 data-c="A live availability board that takes its own bookings."
                 data-a="Web app" data-b="Shipped"></div>

            <div class="layer k-game"   style="--cm:10" data-n="Untitled Game" data-t="In build"
                 data-c="Unity co-op. The combat loop was instrumented from 8.0s down to 2.2s."
                 data-a="Unity" data-b="8.0s &rarr; 2.2s"></div>

            <div class="layer k-mark"   style="--cm:5"  data-n="Codebrew" data-t="Marker bed"
                 data-c="First place twice at CISSA Codebrew, both times as a first-year, both against masters teams."
                 data-a="Two firsts" data-b="Design + full stack"></div>

            <div class="layer k-data"   style="--cm:13" data-n="Biomate" data-t="Live"
                 data-c="A hiking matcher. Roles derived in Postgres over fifty thousand GPS fixes."
                 data-a="Postgres" data-b="50,000 fixes"></div>

            <div class="layer k-tool"   style="--cm:7"  data-n="AgentSentry" data-t="Tooling"
                 data-c="A kill-switch proxy that sits in front of AI agents."
                 data-a="Proxy" data-b="Safety"></div>

            <div class="layer k-game"   style="--cm:12" data-n="Pixel Dungeon Knight" data-t="Playable"
                 data-c="A browser roguelike carrying one hundred and thirty-six weapons."
                 data-a="Browser" data-b="136 weapons"></div>

            <div class="layer k-mark"   style="--cm:5"  data-n="Barista" data-t="Marker bed"
                 data-c="Nationally certified, and the latte art holds up."
                 data-a="Certified" data-b="Espresso"></div>

            <div class="layer k-web"    style="--cm:14" data-n="FanNest" data-t="Live"
                 data-c="A Shopify storefront with an automated reels pipeline behind it."
                 data-a="Shopify" data-b="Automated reels"></div>

            <div class="layer k-data"   style="--cm:7"  data-n="FreshTrack" data-t="Prototype"
                 data-c="Food freshness, read by computer vision."
                 data-a="Vision" data-b="Prototype"></div>

            <div class="layer k-game"   style="--cm:9"  data-n="Hollowborne" data-t="In build"
                 data-c="An action RPG written in plain JavaScript."
                 data-a="JavaScript" data-b="Action RPG"></div>

            <div class="layer k-tool"   style="--cm:7"  data-n="Motion Pipeline" data-t="Tooling"
                 data-c="Remotion video, with the sound cut to the frame."
                 data-a="Remotion" data-b="Frame-timed"></div>

            <div class="layer k-mark"   style="--cm:5"  data-n="Languages" data-t="Marker bed"
                 data-c="Indonesian native. English at IELTS 7.0."
                 data-a="Indonesian" data-b="IELTS 7.0"></div>

            <div class="layer k-rock"   style="--cm:22" data-n="Surabaya" data-t="Bedrock"
                 data-c="Where the sample starts. Everything above it was drilled in Melbourne."
                 data-a="Bedrock" data-b="2006"></div>
          </div>

          <div class="toe" aria-hidden="true"></div>
        </div>

        <div class="glass" aria-hidden="true"></div>
        <div class="window" aria-hidden="true"><i></i><i></i></div>
      </div>

      <div class="slab" id="slab" hidden>
        <p class="slab__d mono" id="slabDepth">0&ndash;10 cm</p>
        <h3 class="slab__n" id="slabName">baka nae.</h3>
        <p class="slab__c" id="slabClause">&nbsp;</p>
        <p class="slab__f mono"><span id="slabA">&nbsp;</span><span id="slabB">&nbsp;</span></p>
      </div>
    </section>

    <aside class="readout">
      <p class="mono depth" id="depth">0&ndash;10 cm</p>
      <h2 class="name" id="name">baka nae.</h2>
      <p class="mono state" id="state">In build</p>
      <div class="panel">
        <button class="step" id="up" aria-label="Previous layer, up the core">&#9650;</button>
        <button class="step" id="down" aria-label="Next layer, down the core">&#9660;</button>
        <button class="cut" id="cut" aria-label="Cut this layer open">Cut</button>
      </div>
      <p class="mono count" id="count">Cut 00 / 15</p>
    </aside>

  </div>

  <footer class="foot">
    <a class="mail" href="mailto:aufanhakim1920@gmail.com">aufanhakim1920@gmail.com</a>
    <span class="mono hint">Drag the core</span>
  </footer>

</main>

<script src="app.js"></script>
</body>
</html>
