# The gallery's verdict table lives on a free Supabase project, and free projects pause after a
# week without traffic. Two reads a week keep it awake. The key below is the publishable one,
# designed to ship in client code; row level security is what protects the table.
name: keep the verdict database awake
on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl -fsS "https://qvveohpluoqmomzanjjj.supabase.co/rest/v1/film_verdict_latest?select=film&limit=1"
          -H "apikey: sb_publishable_AMDyzr9XOxlPt-6iB5IChA_NjcWdg4W" -H "Authorization: Bearer sb_publishable_AMDyzr9XOxlPt-6iB5IChA_NjcWdg4W"
